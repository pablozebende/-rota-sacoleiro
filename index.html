<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Rota Sacoleiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div><div class="brand">📍 Rota Sacoleiro</div><div class="subtitle">Rota dinâmica • simples para dirigir</div></div>
  <button id="themeBtn" class="icon-btn">☾</button>
</header>

<section id="map"></section>

<section class="stats">
  <div><b id="total">0</b><small>Paradas</small></div>
  <div><b id="done">0</b><small>Feitas</small></div>
  <div><b id="pending">0</b><small>Pendentes</small></div>
  <div><b id="returns">0</b><small>Retornos</small></div>
</section>

<section class="sheet">
  <div class="livebar">
    <div><span class="live-dot"></span><strong id="routeState">Rota parada</strong><small id="routeHint">Adicione paradas e otimize.</small></div>
    <button id="addDuring" class="primary small">+ Adicionar</button>
  </div>

  <div id="nextCard" class="next hidden"></div>

  <div class="sheet-title">
    <h2>Paradas restantes</h2>
    <button id="filterBtn" class="secondary small">Filtros</button>
  </div>

  <div id="stopList"></div>

  <div class="route-box">
    <div class="route-info"><span>Planejamento</span><strong id="routeSummary">Nenhuma rota calculada</strong></div>
    <button id="optimizeRemaining" class="primary full">↻ Otimizar o que falta</button>
    <div class="two">
      <button id="pendingRoute" class="secondary">🟠 Só pendentes</button>
      <button id="returnRoute" class="secondary">🔵 Só retornos</button>
    </div>
    <button id="startRoute" class="start full">▶ Iniciar rota</button>
  </div>
</section>
</div>

<div id="modal" class="modal hidden"><div class="modal-card">
<button id="close" class="close">×</button><div id="modalBody"></div>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
